; ============================================================
;  Monitoreo de plantas - PlatformIO (framework ESP-IDF)
;  Abre ESTA carpeta en VS Code con la extensión PlatformIO.
;  Elige el entorno abajo en la barra azul: esp32dev o pcb_esp32c3
; ============================================================
[platformio]
src_dir = main                 ; el código está en /main (estructura de ESP-IDF)
default_envs = esp32dev

[env]
platform = espressif32
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
board_build.partitions = partitions.csv
board_build.embed_txtfiles = main/web/index.html   ; la página web va dentro del firmware

; ---- Prueba de concepto: ESP32 DevKit en protoboard ----
[env:esp32dev]
board = esp32dev

; ---- PCB final con ESP32-C3-WROOM-02 ----
[env:pcb_esp32c3]
board = esp32-c3-devkitm-1
